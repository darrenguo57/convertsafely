    <meta property="twitter:card" content="summary_large_image" />

    <meta property="twitter:title" content="ConvertSafely - Secure File Format Conversion | 100% Private" />

    <meta name="application-name" content="ConvertSafely" />
    <meta name="apple-mobile-web-app-title" content="ConvertSafely" />

    <!-- Structured Data - JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "ConvertSafely",
      "description": "Secure browser-based file conversion service. Convert images, PDFs, videos, and audio files locally without uploading to servers.",
      "url": "https://convertsafely.com",
      "applicationCategory": "UtilityApplication",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "100% private local processing",
        "Image format conversion",
        "PDF conversion",
        "Video format conversion",
        "Audio format conversion",
        "Batch processing",
        "No file uploads required"
      ],
      "author": {
        "@type": "Organization",
        "name": "ConvertSafely",
        "url": "https://convertsafely.com"
      }
    }
    </script>

    <!-- Organization Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

      "logo": "https://convertsafely.com/logo.png",

        "https://github.com/convertsafely"
